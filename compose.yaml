name: nf3-cerrado
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root_nf3_local
    ports: ["127.0.0.1:3307:3306"]
    volumes:
      - mysql_data:/var/lib/mysql
      - ./dados:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysql -h 127.0.0.1 -uroot -e 'SELECT 1' nf3_lab"]
      interval: 5s
      timeout: 5s
      retries: 40
  redis:
    image: redis:7.4
    profiles: ["modelos"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis_data:/data"]
volumes:
  mysql_data:
  redis_data:
